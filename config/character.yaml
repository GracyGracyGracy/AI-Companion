# ============================================================
#  Pulse — 角色配置文件
#  填写你的角色设定，然后运行 main.py 即可启动
#  详细指南：docs/character_guide.md
# ============================================================

character:
  name: ""            # 必填
  age: 
  gender: ""

  # ── 核心人格（必填，越详细越好，建议200字以上）──
  # 这段文字决定了角色在所有场景下的表现
  core_personality: |


  # ── 表层性格（会随时间缓慢变化）──
  surface_personality: |


  # ── 说话风格 ──
  speaking_style: |


    回复1-4句，不写小说。
    禁止动作描写和括号表演。
    长消息用反斜线 \ 分隔。

  # ── 兴趣爱好（影响自主学习和主动话题）──
  interests:


  # ── 作息时间 ──
  schedule:
    wake_up: "06:30"            # 几点起床
    sleep: "23:30"              # 几点睡觉
    active_hours:
      - "7:30-23:00"           # 最活跃时段

  # ── 关系定位 ──
  relationship_type: "恋人"     # 恋人 / 朋友 / 家人 / 同事

# ── 用户信息 ──
user:
  name: ""
  nicknames: []                 # 角色可以叫你的昵称
  timezone: "Asia/Shanghai"

# ── LLM 设置 ──
llm:
  chat_model:
    provider: "deepseek"        # deepseek / openai / claude / gemini
    model: "deepseek-chat"
    api_key: "env:LLM_API_KEY"  # 从 .env 读取，不要直接写 key
    supports_vision: false      # true = 模型自带看图（如 GPT-4o、Claude、Gemini）
                                # false = 需要配合下方 vision_model 才能识别图片

  background_model:             # 后台任务用的模型（记忆压缩、事件检测等）
    provider: "deepseek"
    model: "deepseek-chat"
    api_key: "env:LLM_API_KEY"

  # ── 图片识别模型（仅 supports_vision: false 时需要）──
  # 如果你的 chat_model 已经支持看图（如 GPT-4o），可以删掉这段
  # 推荐使用 Google Gemini，有免费额度
  # API Key 申请地址：https://aistudio.google.com/apikey
  vision_model:
    provider: "gemini"
    model: "gemini-3.1-flash-lite"
    api_key: "env:GOOGLE_API_KEY"

# ── 连接器 ──
connector:
  type: "telegram"                    # telegram / none（本地命令行测试）
  telegram:
    bot_token: ""
    allowed_chat_ids: []          # 留空 = 允许所有人
    emergency_keyword: ""
    reset_keyword: ""

# ── 记忆 ──
memory:
  max_active_memories: 10
  active_days: 30
  archive_days: 180
